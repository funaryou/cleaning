#!/bin/bash
# ============================================================================
# clean.conf — 掃除対象設定ファイル
# ============================================================================
# 使い方:
#   各項目を true（掃除する）または false（スキップ）で設定します。
#   clean.sh がこの設定を読み込んで実行します。
# ============================================================================

# ============================================================
# Section 1: パッケージマネージャキャッシュ
# リスク: 低。すべて再ダウンロード可能。
# ============================================================

# npm キャッシュ (~/.npm/_cacache/ 約3.5GB)
# 削除後は npm install 時に再生成されます。
CLEAN_NPM_CACHE=true

# bun キャッシュ (~/.bun/install/ 約1.9GB)
# 削除後は bun install 時に再生成されます。
CLEAN_BUN_CACHE=true

# Homebrew キャッシュ (~/Library/Caches/Homebrew/ 約500MB + brew cleanup)
# brew cleanup --prune=all と brew autoremove を実行します。
CLEAN_BREW_CACHE=true

# pip キャッシュ (~/Library/Caches/pip/ 約130MB)
# Python パッケージのキャッシュ。削除後は pip install で再生成されます。
CLEAN_PIP_CACHE=true


# ============================================================
# Section 2: 開発ツールキャッシュ
# リスク: 低〜中。ツールの再起動で再生成されます。
# ============================================================

# Pencil updater キャッシュ (~/Library/Caches/pencil-updater/ 約573MB)
CLEAN_PENCIL_UPDATER=true

# Codex runtimes (~/.cache/codex-runtimes/ 約748MB)
CLEAN_CODEX_RUNTIMES=true

# Antigravity updater キャッシュ (~/Library/Caches/antigravity-updater/ 約323MB)
CLEAN_ANTIGRAVITY_UPDATER=true

# Google Software Update キャッシュ (~/Library/Caches/com.google.antigravity.ShipIt/ 約423MB)
CLEAN_GOOGLE_SHIPIT=true

# Microsoft Edge/Edge Beta アップデータキャッシュ (~/Library/Application Support/Microsoft/EdgeUpdater/ 約4.5GB)
# Edge / Edge Beta のアップデート用キャッシュ。削除しても次回更新時に再生成されます。
CLEAN_EDGE_UPDATER=true

# node-gyp キャッシュ (~/Library/Caches/node-gyp/ 約62MB)
# Node.js ネイティブアドオンのビルドキャッシュ。削除後は再ビルドが必要です。
CLEAN_NODE_GYP_CACHE=true

# Playwright ブラウザバイナリ (~/Library/Caches/ms-playwright-go/ 約251MB)
# E2E テスト用のブラウザ。テストを実行しないなら不要です。
CLEAN_PLAYWRIGHT_CACHE=true

# Java LSP (jdtls) キャッシュ (~/Library/Caches/jdtls-*/ 約124MB)
# Java 開発をしないなら不要です。
CLEAN_JDTLS_CACHE=true

# GoogleUpdater (~/Library/Application Support/Google/GoogleUpdater/ 約757MB)
# Chrome/Chrome Canary/Beta/Dev のアップデータキャッシュ
CLEAN_GOOGLE_UPDATER=true


# ============================================================
# Section 3: IDE キャッシュ
# リスク: 低。再起動時に再生成。拡張機能のVSIXは再ダウンロード。
# ============================================================

# VSCode キャッシュ類
# - CachedExtensionVSIXs: 約620MB（拡張機能のインストーラ）
# - Cache / CachedData: 各種キャッシュ
CLEAN_VSCODE_CACHE=true

# Windsurf キャッシュ類 (Cache, CachedData, WebStorage)
CLEAN_WINDSURF_CACHE=true

# Cursor キャッシュ類 (Cache, CachedData, WebStorage)
CLEAN_CURSOR_CACHE=true

# Zed キャッシュ類 (node, external_agents, extensions キャッシュ)
CLEAN_ZED_CACHE=true


# ============================================================
# Section 4: ブラウザキャッシュ
# リスク: 低。再起動時に再生成。ログイン状態は維持されます。
# ============================================================

# Microsoft Edge キャッシュ (約1.4GB)
CLEAN_EDGE_CACHE=true

# Microsoft Edge Beta キャッシュ (約1.3GB)
CLEAN_EDGE_BETA_CACHE=true

# Firefox キャッシュ (約323MB)
CLEAN_FIREFOX_CACHE=true

# Mozilla アプリキャッシュ (~/Library/Caches/Mozilla/ 約503MB)
# Firefox 関連の補助キャッシュ。削除しても問題ありません。
CLEAN_MOZILLA_CACHE=true

# Google キャッシュ (Chrome系: 約385MB)
CLEAN_GOOGLE_CACHE=true


# ============================================================
# Section 5: コミュニケーションアプリキャッシュ
# リスク: 低。再起動時に再生成。
# ============================================================

# Discord キャッシュ (~/Library/Application Support/discord/Cache/ 約930MB)
# Discord の画像・ファイルキャッシュ。削除してもログイン状態や設定は維持されます。
CLEAN_DISCORD_CACHE=true


# ============================================================
# Section 6: 大容量キャッシュ（注意）
# リスク: 中。削除後の初回動作で再生成に時間がかかる場合あり。
# ============================================================

# Claude VM バンドル (~/Library/Application Support/Claude/vm_bundles/ 約9.7GB)
# Claude のサンドボックスVMイメージ。削除後、次回起動時に再生成されます。
# 削除しても Claude の設定や履歴には影響しません。
CLEAN_CLAUDE_VM=true

# Orbstack 未使用イメージ削除 (orb prune)
# Docker の未使用コンテナ・イメージ・ボリュームを削除します。
# 起動中のコンテナには影響しません。
# 注意: 未使用イメージは再プルが必要です。
CLEAN_ORB_PRUNE=true


# ============================================================
# Section 6: システム系（注意）
# リスク: 中〜高。システム動作に影響する可能性あり。
# ============================================================

# システムログ (/Library/Logs/ 約126MB)
# トラブルシューティングに使うログが消えます。
CLEAN_SYSTEM_LOGS=false

# システムアップデートキャッシュ (/Library/Updates/ 約899MB)
# インストール済みのアップデートパッケージ。削除しても問題ありません。
CLEAN_SYSTEM_UPDATES=false
